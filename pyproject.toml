[project]
name = "tiresias"
version = "0.1.0"
description = "FaceTime assistant that finds an everyday item and checks its label."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "pillow>=11.0",
  "psycopg[binary]>=3.2",
  "pymongo>=4.20",
]

[project.optional-dependencies]
media = [
  "livekit-agents~=1.8.12",
  "livekit-plugins-elevenlabs~=1.8.12",
  "livekit-plugins-silero~=1.8.12",
  "elevenlabs>=2.0",
  "google-genai>=1.0",
]
chain = [
  "solana>=0.42",
  "solders>=0.28,<0.30",
]

[project.scripts]
tiresias-api = "tiresias.app:main"
tiresias-agent = "tiresias.agent.main:main"
tiresias-jobs = "tiresias.jobs:main"
tiresias-migrate = "tiresias.migrate:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
